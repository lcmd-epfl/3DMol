exclude = [
    ".git",
    ".ruff_cache",
    "data",
    "logs",
    "wandb",
]

line-length = 128
indent-width = 4

target-version = "py312"

[format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[lint.pydocstyle]
convention = "google"

[lint]

preview = true

allowed-confusables = ["ρ", "×", "–", "γ"]

select = [
  "A", "E", "F", "B",
#"S",
#"COM", # TODO
#"C4", # TODO
  "EXE", "PIE", "PLR1714", "ARG",
  "PERF",
  "FURB",  "PLE",
#"TRY",
  "W",
#"UP", # TODO
#"RUF", # TODO
#"SIM", # TODO
  "NPY",
#"EM",
#"RET",
#"PLR",
#"BLE",
#"PLC", # TODO
#"FBT", # TODO
#"Q",
#"FIX", "TD", # TODO
#"ERA", TODO
]
ignore = [
  "E722", # bare-except
  "D105",     # undocumented-magic-method
  "NPY002",   # numpy-legacy-random
  "E741",     # ambiguous-variable-name
  "E501",     # line-too-long
  'PLR0912', # too-many-branches
  'PLR0913', # too-many-arguments
  'PLR0914', # too-many-locals
  'PLR0917', # too-many-positional-arguments
  'PLR1702', # too-many-nested-blocks
  'PLR6301', # no-self-use
  "FURB118", # reimplemented-operator
  "FURB101", "FURB103", # pathlib
# whitespaces
  "E201", "E202", "E203", "E211",
  "E221", "E222", "E225", "E226", "E227", "E228",
  "E231", "E241", "E271", "E272",
]


[lint.per-file-ignores]
"process/dataloader.py" = ["ARG002"] # unused-method-argument
"process/dataloader_test.py" = ["ARG002"] # unused-method-argument
